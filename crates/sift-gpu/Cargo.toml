[package]
name = "visloc-sift-gpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "wgpu compute SIFT (DoG detector + descriptors) mirroring visloc-vision's default SIFT path."
readme.workspace = true
documentation = "https://docs.rs/visloc-sift-gpu"
homepage.workspace = true
repository.workspace = true
keywords = ["sift", "features", "wgpu", "gpu", "sfm"]
categories = ["computer-vision", "science::robotics"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# The GPU extractor. Opt-in for the same toolchain reason as
# `visloc-gsplat-render/gpu` (wgpu 30 / naga need Rust >= 1.85).
gpu = ["visloc-gsplat-render/gpu", "dep:wgpu", "dep:bytemuck", "dep:pollster"]

[dependencies]
bytemuck = { workspace = true, optional = true }
nalgebra = { workspace = true }
pollster = { workspace = true, optional = true }
thiserror = { workspace = true }
visloc-gsplat-render = { path = "../gsplat-render", version = "0.2.1" }
visloc-vision = { path = "../vision", version = "0.2.1" }
wgpu = { workspace = true, optional = true }

[dev-dependencies]
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }

[[example]]
name = "sift_gpu_bench"
path = "examples/sift_gpu_bench.rs"
required-features = ["gpu"]

[lib]
doctest = false

[lints.rust]
unsafe_code = "deny"

[[example]]
name = "match_gpu_bench"
path = "examples/match_gpu_bench.rs"
required-features = ["gpu"]

[[example]]
name = "sift_dump_features"
path = "examples/sift_dump_features.rs"
required-features = ["gpu"]
