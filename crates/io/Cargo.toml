[package]
name = "visloc-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "COLMAP, descriptor, and query-feature IO helpers for visloc-rs visual maps."
readme.workspace = true
documentation = "https://docs.rs/visloc-io"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[package.metadata.docs.rs]
all-features = true

[features]
default = []
image-io = ["dep:image"]

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"], optional = true }
nalgebra = { workspace = true }
thiserror = { workspace = true }
visloc-core = { path = "../core", version = "0.1.0" }
visloc-vision = { path = "../vision", version = "0.1.0" }
visloc-localization = { path = "../../pipelines/localization", version = "0.1.0" }
visloc-fusion = { path = "../../pipelines/fusion", version = "0.1.0" }
