[package]
name = "visloc-mvs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-view stereo for visloc-rs: PatchMatch depth and normal maps fused into a point cloud."
readme.workspace = true
documentation = "https://docs.rs/visloc-mvs"
homepage.workspace = true
repository.workspace = true
keywords = ["mvs", "stereo", "patchmatch", "3d-reconstruction", "sfm"]
categories = ["computer-vision", "science::robotics"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# PatchMatch on the GPU (wgpu compute shaders). Opt-in for the same
# toolchain reason as `visloc-gsplat-render/gpu` (wgpu 30 / naga need a
# current Rust).
gpu = ["dep:wgpu", "dep:bytemuck", "dep:visloc-gsplat-render", "visloc-gsplat-render/gpu"]
# PatchMatch on CUDA: a native library (native/mvs_cuda, built by
# scripts/build_mvs_cuda.sh) loaded at runtime, for machines where wgpu
# cannot reach the GPU (WSL2). Cargo never compiles CUDA.
cuda = ["dep:libloading"]

[dependencies]
bytemuck = { workspace = true, optional = true }
delaunator = "1.1"
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
libloading = { version = "0.9", optional = true }
nalgebra = { workspace = true }
rayon = { workspace = true }
thiserror = { workspace = true }
visloc-gsplat-core = { path = "../gsplat-core", version = "0.3.1", features = ["mesh"] }
visloc-gsplat-render = { path = "../gsplat-render", version = "0.3.1", optional = true }
wgpu = { workspace = true, optional = true }

[lib]
doctest = false

[lints.rust]
# `deny`, not `forbid`: the `cuda` module calls its native library (and
# allows `unsafe_code` there alone).
unsafe_code = "deny"

[[example]]
name = "mvs"
path = "examples/mvs.rs"
