[package]
name = "visloc-gsplat-cuda"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Runtime-loaded native CUDA 3D Gaussian Splatting rasterizer and trainer for visloc-gsplat (opt-in)."
readme.workspace = true
documentation.workspace = true
homepage.workspace = true
repository.workspace = true
# Experimental: not published yet.
publish = false

[package.metadata.docs.rs]
all-features = true

[dependencies]
libloading = "0.9"
nalgebra = { workspace = true }
rayon = { workspace = true }
visloc-gsplat-core = { path = "../gsplat-core", version = "0.3.1" }
visloc-gsplat-render = { path = "../gsplat-render", version = "0.3.1" }
visloc-gsplat-train = { path = "../gsplat-train", version = "0.3.1", default-features = false, features = ["mesh"] }
visloc-vision = { path = "../vision", version = "0.3.1", optional = true }

[features]
default = []
# Descriptor matching on the GPU for `build_photo_dataset`
# (`matching::CudaPairMatcher`, example `gsplat_photos_cuda`).
photos = ["dep:visloc-vision", "visloc-gsplat-train/euroc"]

[lib]
doctest = false

[[example]]
name = "gsplat_photos_cuda"
path = "examples/gsplat_photos_cuda.rs"
required-features = ["photos"]
