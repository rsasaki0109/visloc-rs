[package]
name = "visloc-gsplat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "CPU reference types, IO, and rasterizer for 3D Gaussian Splatting built on visloc-rs SfM output."
readme.workspace = true
documentation = "https://docs.rs/visloc-gsplat-core"
homepage.workspace = true
repository.workspace = true
keywords = ["gaussian-splatting", "3dgs", "colmap", "novel-view-synthesis", "rendering"]
categories = ["computer-vision", "graphics", "science::robotics"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# COLMAP model parsing is delegated to visloc-io; keep it optional so the
# pure-math and .splat/.ply paths stay dependency-light.
colmap-io = ["dep:visloc-io"]

[dependencies]
nalgebra = { workspace = true }
thiserror = { workspace = true }
visloc-core = { path = "../core", version = "0.2.1" }
visloc-io = { path = "../io", version = "0.2.1", optional = true }

[dev-dependencies]
image = { version = "=0.25.5", default-features = false, features = ["png"] }

[[example]]
name = "gsplat_cpu_render"
path = "examples/gsplat_cpu_render.rs"
required-features = ["colmap-io"]

[lints.rust]
unsafe_code = "deny"
