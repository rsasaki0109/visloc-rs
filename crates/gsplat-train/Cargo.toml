[package]
name = "visloc-gsplat-train"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "3D Gaussian Splatting training and evaluation for visloc-rs (datasets, metrics, trainer)."
readme.workspace = true
documentation = "https://docs.rs/visloc-gsplat-train"
homepage.workspace = true
repository.workspace = true
keywords = ["gaussian-splatting", "3dgs", "training", "colmap", "wgpu"]
categories = ["computer-vision", "graphics", "science::robotics"]

[package.metadata.docs.rs]
all-features = true

[features]
default = []
# GPU rendering / training (wgpu). Same toolchain boundary as
# `visloc-gsplat-render/gpu`: needs Rust >= 1.85, so it is opt-in.
gpu = ["visloc-gsplat-render/gpu", "dep:rayon", "dep:wgpu", "dep:bytemuck", "dep:visloc-sift-gpu", "visloc-sift-gpu?/gpu", "dep:visloc-ba-gpu", "visloc-ba-gpu?/gpu"]
# Raw EuRoC -> dataset via visloc-rs SIFT + incremental SfM (no COLMAP/Python).
euroc = ["dep:rayon", "dep:visloc-core", "dep:visloc-io", "dep:visloc-slam", "dep:visloc-vision"]

[dependencies]
bytemuck = { workspace = true, optional = true }
image = { version = "=0.25.5", default-features = false, features = ["png", "jpeg"] }
nalgebra = { workspace = true }
rayon = { workspace = true, optional = true }
thiserror = { workspace = true }
visloc-gsplat-core = { path = "../gsplat-core", version = "0.2.1", features = ["colmap-io"] }
visloc-core = { path = "../core", version = "0.2.1", optional = true }
visloc-gsplat-render = { path = "../gsplat-render", version = "0.2.1" }
visloc-io = { path = "../io", version = "0.2.1", optional = true }
visloc-ba-gpu = { path = "../ba-gpu", version = "0.2.1", optional = true }
visloc-sift-gpu = { path = "../sift-gpu", version = "0.2.1", optional = true }
visloc-slam = { path = "../../pipelines/slam", version = "0.2.1", optional = true }
visloc-vision = { path = "../vision", version = "0.2.1", optional = true }
wgpu = { workspace = true, optional = true }

[[example]]
name = "gsplat_eval"
path = "examples/gsplat_eval.rs"
required-features = ["gpu"]

[[example]]
name = "gsplat_mesh"
path = "examples/gsplat_mesh.rs"
required-features = ["gpu"]

[[example]]
name = "gsplat_train"
path = "examples/gsplat_train.rs"
required-features = ["gpu"]

[[example]]
name = "gsplat_photos"
path = "examples/gsplat_photos.rs"
required-features = ["gpu", "euroc"]

[[example]]
name = "gsplat_euroc"
path = "examples/gsplat_euroc.rs"
required-features = ["gpu", "euroc"]

[lib]
doctest = false

[lints.rust]
unsafe_code = "deny"
