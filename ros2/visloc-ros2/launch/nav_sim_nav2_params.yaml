# Nav2 parameters for visloc_nav_sim_node (docs/navigation.md), derived from
# nav2_bringup's Jazzy nav2_params.yaml. Changes: no AMCL (visloc publishes
# map -> odom), a 0.2 m round robot, Regulated Pure Pursuit instead of MPPI,
# 2D obstacle layers on the simulated depth-camera scan (inf_is_valid, so
# beams that see nothing clear), and a planner that keeps out of unknown space
# (a visual map leaves textureless walls unknown, not free).
bt_navigator:
  ros__parameters:
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose: {plugin: 'nav2_bt_navigator::NavigateToPoseNavigator'}
    navigate_through_poses: {plugin: 'nav2_bt_navigator::NavigateThroughPosesNavigator'}
    error_code_names: [compute_path_error_code, follow_path_error_code]
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    costmap_update_timeout: 0.3
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugins: [progress_checker]
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    use_realtime_priority: false
    progress_checker: {plugin: 'nav2_controller::SimpleProgressChecker', required_movement_radius: 0.5,
      movement_time_allowance: 10.0}
    general_goal_checker: {stateful: true, plugin: 'nav2_controller::SimpleGoalChecker', xy_goal_tolerance: 0.2,
      yaw_goal_tolerance: 0.25}
    FollowPath: {plugin: 'nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController', desired_linear_vel: 0.4,
      lookahead_dist: 0.5, min_lookahead_dist: 0.3, max_lookahead_dist: 0.9, lookahead_time: 1.5, rotate_to_heading_angular_vel: 1.2,
      transform_tolerance: 0.2, use_velocity_scaled_lookahead_dist: false, min_approach_linear_velocity: 0.05,
      approach_velocity_scaling_dist: 0.6, use_collision_detection: true, max_allowed_time_to_collision_up_to_carrot: 1.0,
      use_regulated_linear_velocity_scaling: true, use_cost_regulated_linear_velocity_scaling: false,
      regulated_linear_scaling_min_radius: 0.9, regulated_linear_scaling_min_speed: 0.25, use_rotate_to_heading: true,
      allow_reversing: false, rotate_to_heading_min_angle: 0.785, max_angular_accel: 3.2, max_robot_pose_search_dist: 10.0}
local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.2
      plugins: [obstacle_layer, inflation_layer]
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 5.0, inflation_radius: 0.45}
      always_send_full_costmap: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, min_obstacle_height: -0.1, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 4.0, raytrace_min_range: 0.0, obstacle_max_range: 3.5,
          obstacle_min_range: 0.0, inf_is_valid: true}
global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.2
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan: {topic: /scan, max_obstacle_height: 2.0, min_obstacle_height: -0.1, clearing: true, marking: true,
          data_type: LaserScan, raytrace_max_range: 4.0, raytrace_min_range: 0.0, obstacle_max_range: 3.5,
          obstacle_min_range: 0.0, inf_is_valid: true}
      static_layer: {plugin: 'nav2_costmap_2d::StaticLayer', map_subscribe_transient_local: true}
      inflation_layer: {plugin: 'nav2_costmap_2d::InflationLayer', cost_scaling_factor: 5.0, inflation_radius: 0.45}
      always_send_full_costmap: true
planner_server:
  ros__parameters:
    expected_planner_frequency: 20.0
    planner_plugins: [GridBased]
    costmap_update_timeout: 1.0
    GridBased: {plugin: 'nav2_navfn_planner::NavfnPlanner', tolerance: 0.3, use_astar: false, allow_unknown: false}
smoother_server:
  ros__parameters:
    smoother_plugins: [simple_smoother]
    simple_smoother: {plugin: 'nav2_smoother::SimpleSmoother', tolerance: 1.0e-10, max_its: 1000, do_refinement: true}
behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, assisted_teleop, wait]
    spin: {plugin: 'nav2_behaviors::Spin'}
    backup: {plugin: 'nav2_behaviors::BackUp'}
    drive_on_heading: {plugin: 'nav2_behaviors::DriveOnHeading'}
    wait: {plugin: 'nav2_behaviors::Wait'}
    assisted_teleop: {plugin: 'nav2_behaviors::AssistedTeleop'}
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint: {plugin: 'nav2_waypoint_follower::WaitAtWaypoint', enabled: true, waypoint_pause_duration: 200}
route_server:
  ros__parameters:
    boundary_radius_to_achieve_node: 1.0
    radius_to_achieve_node: 2.0
    smooth_corners: true
    operations: [AdjustSpeedLimit, ReroutingService, CollisionMonitor]
    ReroutingService: {plugin: 'nav2_route::ReroutingService'}
    AdjustSpeedLimit: {plugin: 'nav2_route::AdjustSpeedLimit'}
    CollisionMonitor: {plugin: 'nav2_route::CollisionMonitor', max_collision_dist: 3.0}
    edge_cost_functions: [DistanceScorer, CostmapScorer]
    DistanceScorer: {plugin: 'nav2_route::DistanceScorer'}
    CostmapScorer: {plugin: 'nav2_route::CostmapScorer'}
velocity_smoother:
  ros__parameters:
    smoothing_frequency: 20.0
    stamp_smoothed_velocity_with_smoothing_time: false
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.5, 0.0, -1.5]
    max_accel: [2.5, 0.0, 3.2]
    max_decel: [-2.5, 0.0, -3.2]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
collision_monitor:
  ros__parameters:
    base_frame_id: base_link
    odom_frame_id: odom
    cmd_vel_in_topic: cmd_vel_smoothed
    cmd_vel_out_topic: cmd_vel
    state_topic: collision_monitor_state
    transform_tolerance: 0.2
    source_timeout: 1.0
    base_shift_correction: true
    stop_pub_timeout: 2.0
    polygons: [FootprintApproach]
    FootprintApproach: {type: polygon, action_type: approach, footprint_topic: /local_costmap/published_footprint,
      time_before_collision: 1.2, simulation_time_step: 0.1, min_points: 6, visualize: false, enabled: true}
    observation_sources: [scan]
    scan: {type: scan, topic: scan, min_height: -0.1, max_height: 2.0, enabled: true}
docking_server:
  ros__parameters:
    controller_frequency: 50.0
    initial_perception_timeout: 5.0
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.05
    undock_angular_tolerance: 0.1
    max_retries: 3
    base_frame: base_link
    fixed_frame: odom
    dock_backwards: false
    dock_prestaging_tolerance: 0.5
    dock_plugins: [simple_charging_dock]
    simple_charging_dock: {plugin: 'opennav_docking::SimpleChargingDock', docking_threshold: 0.05, staging_x_offset: -0.7,
      use_external_detection_pose: true, use_battery_status: false, use_stall_detection: false, external_detection_timeout: 1.0,
      external_detection_translation_x: -0.18, external_detection_translation_y: 0.0, external_detection_rotation_roll: -1.57,
      external_detection_rotation_pitch: -1.57, external_detection_rotation_yaw: 0.0, filter_coef: 0.1}
    controller: {k_phi: 3.0, k_delta: 2.0, v_linear_min: 0.15, v_linear_max: 0.15, use_collision_detection: true,
      costmap_topic: local_costmap/costmap_raw, footprint_topic: local_costmap/published_footprint, transform_tolerance: 0.1,
      projection_time: 5.0, simulation_step: 0.1, dock_collision_threshold: 0.3}
