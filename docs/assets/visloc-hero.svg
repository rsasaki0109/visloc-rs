      <stop stop-color="#35D0BA"/>
      <stop offset="0.52" stop-color="#70A5FF"/>
      <stop offset="1" stop-color="#F9C74F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
