<svg width="1280" height="640" viewBox="0 0 1280 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">visloc-rs visual localization overview</title>
  <desc id="desc">A query camera is localized against a sparse visual map and outputs an SE3 pose.</desc>
