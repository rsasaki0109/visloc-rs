    <text x="54" y="48" fill="#F6F7FB" font-size="30" font-weight="800">Localization vertical slice</text>
    <text x="54" y="76" fill="#B6C7D6" font-size="17">Stateless core parts composed by the pipeline layer</text>
  </g>
