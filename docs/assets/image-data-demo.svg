    <text x="24" y="64" fill="#B6C7D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">examples/data/query_frame.svg</text>
    <svg x="24" y="86" width="474" height="316" viewBox="0 0 960 640" fill="none" xmlns="http://www.w3.org/2000/svg">
