<svg width="1280" height="680" viewBox="0 0 1280 680" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">visloc-rs visual localization demo</title>
  <desc id="desc">Query image features are associated with a sparse SfM map, then PnP RANSAC estimates an SE3 camera pose.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101B2D"/>
      <stop offset="1" stop-color="#0A1020"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="480" y2="170" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9FC9E8"/>
      <stop offset="1" stop-color="#EEF4F8"/>
    </linearGradient>
    <linearGradient id="mapline" x1="650" y1="160" x2="1120" y2="522" gradientUnits="userSpaceOnUse">
      <stop stop-color="#35D0BA"/>
      <stop offset="0.54" stop-color="#70A5FF"/>
      <stop offset="1" stop-color="#F9C74F"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="1280" height="680" rx="20" fill="#08111F"/>
  <text x="48" y="58" fill="#F6F7FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="34" font-weight="900">Map-based visual localization</text>
  <text x="48" y="88" fill="#B6C7D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18">A query frame is matched to sparse SfM landmarks; PnP + RANSAC returns the camera SE3 pose.</text>
