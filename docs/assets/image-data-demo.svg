<svg width="1180" height="520" viewBox="0 0 1180 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">visloc-rs image-backed demo</title>
  <desc id="desc">A real query image asset is loaded, features are extracted, and PnP RANSAC estimates a camera pose.</desc>
  <rect width="1180" height="520" rx="18" fill="#08111F"/>
  <text x="42" y="54" fill="#F6F7FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="32" font-weight="800">Image-backed localization demo</text>
  <text x="42" y="84" fill="#B6C7D6" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">The example reads examples/data/query_frame.svg as image bytes, validates marker data, and localizes through ImageLocalizer.</text>
