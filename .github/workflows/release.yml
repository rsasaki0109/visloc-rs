name: release

# A version tag's release: the GitHub release with prebuilt command-line
# binaries: `gsplat_photos` (photos to SfM, splats and a mesh), `visloc_mvs`
# (dense multi-view stereo), `colmap_incremental_mapper` and `visloc_web`
# (the browser UI, which runs the `gsplat_photos` next to it), and the same
# tools as a container image on ghcr.io (`ghcr.io/rsasaki0109/visloc-rs`,
# see docs/docker.md). A `v*` tag push builds them all.
#
# A manual run works on an existing tag. Its release notes come from the
# CHANGELOG.md of the branch it runs from (main), so that later edits such
# as cutting a section down to highlights reach the release; `notes_ref`
# picks another branch or tag. `binaries` and `image` choose what is rebuilt;
# with both unticked a manual run only rewrites the release notes.
#
# Publishing the Rust crates to crates.io and the `visloc` Python wheels to
# PyPI is opt-in: only a manual run with `publish` ticked does it, never a
# tag push. It needs a one-time setup (docs/publishing.md, "Publishing to
# crates.io and PyPI").

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach binaries to (e.g. v0.3.0)"
        required: true
      notes_ref:
        description: "Branch or tag to read CHANGELOG.md from for the release notes (default: the branch this run uses)"
        required: false
        default: ""
      binaries:
        description: "Build and attach the binaries"
        type: boolean
        default: true
      image:
        description: "Build and push the container image to ghcr.io"
        type: boolean
        default: true
      publish:
        description: "Also publish the crates to crates.io and the wheels to PyPI (already published versions are skipped)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # A tag push reads the tag's CHANGELOG.md; a manual run reads its branch's.
  NOTES_REF: ${{ github.event.inputs.notes_ref || (github.event_name == 'workflow_dispatch' && github.ref_name) || '' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Create the release from the CHANGELOG section
        shell: bash
        run: |
          version="${TAG#v}"
          changelog=CHANGELOG.md
          if [ -n "$NOTES_REF" ]; then
            git fetch --depth=1 origin "$NOTES_REF"
            git show FETCH_HEAD:CHANGELOG.md > notes-changelog.md
            changelog=notes-changelog.md
          fi
          # The section between "## <version>" and the next "## " heading.
          awk -v v="$version" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' "$changelog" > notes.md
          if [ ! -s notes.md ]; then echo "See CHANGELOG.md." > notes.md; fi
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md
          else
            gh release create "$TAG" --title "visloc-rs $version" --notes-file notes.md --verify-tag
          fi

  binaries:
    needs: release
    if: github.event_name == 'push' || inputs.binaries
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 for an older glibc (2.35), so the Linux binaries also
          # run on Ubuntu 22.04 / Debian 12 and newer.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        shell: bash
        run: |
          cargo build --release --locked -p visloc-gsplat-train --features "gpu euroc" --example gsplat_photos
          cargo build --release --locked -p visloc-mvs --features gpu --example mvs
          cargo build --release --locked -p visloc-rs --example colmap_incremental_mapper --example visloc_web

      - name: Package
        shell: bash
        run: |
          exe=""
          if [ "${{ runner.os }}" = "Windows" ]; then exe=".exe"; fi
          name="visloc-rs-${TAG}-${{ matrix.target }}"
          mkdir "$name"
          src=target/release/examples
          cp "$src/gsplat_photos$exe" "$src/colmap_incremental_mapper$exe" "$src/visloc_web$exe" "$name/"
          # `mvs` is the example's name in the repository; ship it under a
          # name that says what it is.
          cp "$src/mvs$exe" "$name/visloc_mvs$exe"
          cp LICENSE-MIT LICENSE-APACHE "$name/"
          cat > "$name/README.txt" <<EOF
          visloc-rs ${TAG} (${{ matrix.target }})
          https://github.com/rsasaki0109/visloc-rs

          gsplat_photos              photos -> SfM (COLMAP model), 3D Gaussian splats and a mesh
                                     (gsplat_photos --help; docs/photos_to_splat.md)
          visloc_mvs                 dense multi-view stereo from a COLMAP model
                                     (the repository's "mvs" example; docs/mvs.md)
          colmap_incremental_mapper  the COLMAP-port incremental mapper
          visloc_web                 browser UI for gsplat_photos on http://127.0.0.1:8080
                                     (keep it in the same folder as gsplat_photos)

          GPU paths use wgpu (Vulkan, Metal or DirectX 12); --cpu runs gsplat_photos'
          SfM on the CPU. Licensed under MIT or Apache-2.0.
          EOF
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$name.zip" "$name" > /dev/null
            archive="$name.zip"
          else
            tar czf "$name.tar.gz" "$name"
            archive="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload to the release
        shell: bash
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  image:
    name: Container image (ghcr.io)
    if: github.event_name == 'push' || inputs.image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # Tags from before the Dockerfile existed (v0.4.0 and older) build
      # their own sources with this run's Dockerfile.
      - name: Take the Dockerfile from this run's commit if the tag has none
        shell: bash
        run: |
          if [ ! -f Dockerfile ]; then
            git fetch --depth=1 origin "$GITHUB_SHA"
            git checkout FETCH_HEAD -- Dockerfile .dockerignore
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` follows the newest version tag only, so rebuilding an older
      # tag's image does not move it back.
      - name: Is this the newest version tag?
        id: newest
        shell: bash
        run: |
          newest="$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/##' | sort -V | tail -n 1)"
          echo "newest version tag: $newest"
          if [ "$newest" = "$TAG" ]; then echo "latest=true"; else echo "latest=false"; fi >> "$GITHUB_OUTPUT"

      # <version>, <major>.<minor> and (see above) latest. The image's
      # org.opencontainers.image.source label links the package to this
      # repository, so it shows under the repository's Packages.
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=${{ steps.newest.outputs.latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=visloc-rs
            org.opencontainers.image.description=gsplat_photos, visloc_mvs, colmap_incremental_mapper and visloc_web from visloc-rs
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  crates:
    name: Publish to crates.io
    needs: release
    if: inputs.publish
    runs-on: ubuntu-latest
    # The first release creates eighteen new crates, which crates.io admits a
    # few at a time (scripts/publish_crates.sh waits out the rate limit).
    timeout-minutes: 300
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Check the tag against the crate version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match the workspace version $version"
            exit 1
          fi

      - name: Choose the crates.io credential
        id: mode
        shell: bash
        env:
          HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
          TRUSTED: ${{ vars.CRATES_IO_TRUSTED_PUBLISHING == 'true' }}
        run: |
          if [ "$HAS_TOKEN" = "true" ]; then
            echo "mode=token" >> "$GITHUB_OUTPUT"
          elif [ "$TRUSTED" = "true" ]; then
            echo "mode=trusted" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
            echo "::notice::crates.io publishing skipped: set the CARGO_REGISTRY_TOKEN secret or the CRATES_IO_TRUSTED_PUBLISHING variable (docs/publishing.md)"
          fi

      - name: Install Rust
        if: steps.mode.outputs.mode != 'none'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        if: steps.mode.outputs.mode != 'none'
        uses: Swatinem/rust-cache@v2
        with:
          key: publish-crates

      - name: Package and verify-build every crate
        if: steps.mode.outputs.mode != 'none'
        run: cargo package --workspace

      - name: Get a crates.io token (trusted publishing)
        id: auth
        if: steps.mode.outputs.mode == 'trusted'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.mode.outputs.mode != 'none'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: scripts/publish_crates.sh

  wheels:
    name: Python wheels (${{ matrix.os }} ${{ matrix.target }})
    needs: release
    if: inputs.publish
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: windows-latest
            target: x64
          - os: macos-latest
            target: aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # CPython 3.10 to 3.14 (on Linux the manylinux container brings its
      # own); other interpreters build from the sdist. The last version
      # listed is the default `python`, used for the smoke test.
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: |
            3.10
            3.11
            3.13
            3.14
            3.12

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: auto
          args: >-
            --release --locked --out dist
            ${{ runner.os == 'Linux' && '-i python3.10 python3.11 python3.12 python3.13 python3.14' || '--find-interpreter' }}

      - name: Smoke-test a wheel
        if: matrix.target != 'aarch64' || runner.os == 'macOS'
        shell: bash
        working-directory: bindings/python
        run: |
          python -m pip install --quiet --disable-pip-version-check numpy pytest
          python -m pip install --quiet --disable-pip-version-check --no-index --find-links dist visloc
          python -m pytest -q

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl
          if-no-files-found: error

  sdist:
    name: Python sdist
    needs: release
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - name: Build the sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist

      - name: Upload the sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: bindings/python/dist/*.tar.gz
          if-no-files-found: error

  pypi:
    name: Publish to PyPI
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # PyPI trusted publishing: the `visloc` project trusts this repository's
    # `release.yml` in the `pypi` environment (docs/publishing.md).
    environment:
      name: pypi
      url: https://pypi.org/project/visloc/
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download the wheels and the sdist
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Attach them to the GitHub release
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
