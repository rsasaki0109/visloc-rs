name: SLAM Dunk black-box benchmark

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    env:
      SLAM_DUNK_REV: 38896a38fd87e0448a8532209a5e459994232f26
      SEQUENCE: sequence_1_19
      DATA: https://cvg-data.inf.ethz.ch/lamaria
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Get the upstream release revision and public recording
        shell: bash
        run: |
          git init -q upstream
          git -C upstream fetch --depth=1 https://github.com/jacobvm04/slam-dunk.git "$SLAM_DUNK_REV"
          git -C upstream checkout --quiet --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$SLAM_DUNK_REV"
          mkdir -p input
          for attempt in 1 2 3 4 5; do
            curl --http1.1 --fail --location --silent --show-error --continue-at - \
              "$DATA/raw_data/training/$SEQUENCE.vrs" --output input/recording.vrs || true
            if [ "$(stat -c %s input/recording.vrs 2>/dev/null || true)" = 5942905071 ]; then break; fi
            sleep 5
          done
          printf '%s  %s\n' 65a2987cf0a966b0b503d7b614422d79311cde2a754ab857ef90d405b14fdd39 input/recording.vrs | sha256sum -c
          curl -fsSL --retry 5 "$DATA/aria_calibrations/training/$SEQUENCE.json" -o input/calibration.json

      - name: Prepare the full recording
        shell: bash
        run: |
          python -m venv .venv-extract
          .venv-extract/bin/pip install --no-cache-dir -r upstream/tools/requirements.txt
          start=$(date +%s)
          .venv-extract/bin/python upstream/tools/extract_recording.py input/recording.vrs "data/$SEQUENCE" \
            --calibration input/calibration.json
          test "$(wc -l < "data/$SEQUENCE/cam0/data.csv")" = 18353
          test "$(wc -l < "data/$SEQUENCE/cam1/data.csv")" = 18353
          mkdir -p metrics
          printf '%s\n' "$(( $(date +%s) - start ))" > metrics/extraction_seconds.txt
          rm input/recording.vrs
          df -h .

      - name: Build upstream as published
        shell: bash
        run: docker build --progress=plain -t slam-dunk-benchmark upstream

      - name: Run SLAM Dunk full
        shell: bash
        run: |
          mkdir -p results
          start=$(date +%s)
          docker run --rm --network none --user "$(id -u):$(id -g)" \
            --cpus 4 --memory 8g --memory-swap 8g --read-only --tmpfs /tmp:rw,exec,size=512m \
            -v "$PWD/data/$SEQUENCE:/recording:ro" -v "$PWD/results:/results" \
            slam-dunk-benchmark run /recording /results/full --config configs/full.json
          printf '%s\n' "$(( $(date +%s) - start ))" > metrics/inference_seconds.txt
          test -s results/full/estimate/trajectory.txt
          df -h .

      - name: Get visloc-rs estimates from the prior full-sequence experiment
        uses: actions/download-artifact@v8
        with:
          name: estimate-sequence_1_19
          run-id: "44426858799"
          github-token: ${{ github.token }}
          path: visloc

      - name: Score both methods with the same evaluator
        shell: bash
        run: |
          mkdir -p labels
          curl -fsSL --retry 5 "$DATA/ground_truth/pseudo_dense/$SEQUENCE.txt" -o "labels/$SEQUENCE.txt"
          curl -fsSL --retry 5 "$DATA/ground_truth/sparse/$SEQUENCE.json" -o "labels/$SEQUENCE.json"
          python -m venv .venv-metrics
          python -m venv .venv-cp
          .venv-metrics/bin/pip install --no-cache-dir -r upstream/evaluation/metrics-requirements.lock
          .venv-cp/bin/pip install --no-cache-dir -r upstream/evaluation/official-evaluator-requirements.lock
          for entry in \
            "slam_dunk_full:results/full/estimate/trajectory.txt" \
            "visloc_current:visloc/logs/$SEQUENCE/baseline_estimate.txt" \
            "visloc_experimental:visloc/slam/$SEQUENCE.txt"; do
            name=${entry%%:*}
            estimate=${entry#*:}
            output="metrics/$name/metrics.json"
            mkdir -p "$(dirname "$output")"
            .venv-metrics/bin/python upstream/evaluation/score_lamaria.py \
              "data/$SEQUENCE" "$estimate" "$output" \
              --cp-python "$PWD/.venv-cp/bin/python" \
              --public-pgt "labels/$SEQUENCE.txt" --public-control-points "labels/$SEQUENCE.json"
          done
          {
            printf '### LaMAria %s, full sequence\n\n' "$SEQUENCE"
            printf '| Method | CP score | CP recall at 1 m (%%) | APE RMSE (m) |\n|---|---:|---:|---:|\n'
            for method in slam_dunk_full visloc_current visloc_experimental; do
              jq -r --arg method "$method" '"| \($method) | \(.cp_score) | \(.cp_recall_1m) | \(.ate_rmse_m) |"' "metrics/$method/metrics.json"
            done
            printf '\nSLAM Dunk inference wall time on this runner (4 vCPUs): %s s.\n' "$(cat metrics/inference_seconds.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save numeric benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slam-dunk-visloc-metrics-sequence_1_19
          path: |
            metrics/*_seconds.txt
            metrics/*/metrics.json
          if-no-files-found: warn
          retention-days: 14
