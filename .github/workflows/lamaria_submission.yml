name: SLAM Dunk camera and gyro ablation

on:
  workflow_dispatch:
  push:
    branches: [benchmark/slam-dunk-ablation-1-19]

permissions:
  contents: read
  actions: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 230
    env:
      SLAM_DUNK_REV: 38896a38fd87e0448a8532209a5e459994232f26
      SEQUENCE: sequence_1_19
      DATA: https://cvg-data.inf.ethz.ch/lamaria
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Get the upstream release revision and public recording
        shell: bash
        run: |
          git init -q upstream
          git -C upstream fetch --depth=1 https://github.com/jacobvm04/slam-dunk.git "$SLAM_DUNK_REV"
          git -C upstream checkout --quiet --detach FETCH_HEAD
          test "$(git -C upstream rev-parse HEAD)" = "$SLAM_DUNK_REV"
          mkdir -p input
          for attempt in 1 2 3 4 5; do
            curl --http1.1 --fail --location --silent --show-error --continue-at - \
              "$DATA/raw_data/training/$SEQUENCE.vrs" --output input/recording.vrs || true
            if [ "$(stat -c %s input/recording.vrs 2>/dev/null || true)" = 5942905071 ]; then break; fi
            sleep 5
          done
          printf '%s  %s\n' 65a2987cf0a966b0b503d7b614422d79311cde2a754ab857ef90d405b14fdd39 input/recording.vrs | sha256sum -c
          curl -fsSL --retry 5 "$DATA/aria_calibrations/training/$SEQUENCE.json" -o input/calibration.json

      - name: Prepare the full recording
        shell: bash
        run: |
          python -m venv .venv-extract
          .venv-extract/bin/pip install --no-cache-dir -r upstream/tools/requirements.txt
          start=$(date +%s)
          .venv-extract/bin/python upstream/tools/extract_recording.py input/recording.vrs "data/$SEQUENCE" \
            --calibration input/calibration.json
          test "$(wc -l < "data/$SEQUENCE/cam0/data.csv")" = 18353
          test "$(wc -l < "data/$SEQUENCE/cam1/data.csv")" = 18353
          mkdir -p metrics
          printf '%s\n' "$(( $(date +%s) - start ))" > metrics/extraction_seconds.txt
          rm input/recording.vrs
          df -h .

      - name: Build upstream as published
        shell: bash
        run: docker build --progress=plain -t slam-dunk-benchmark upstream

      - name: Prepare once and refine with four public configurations
        shell: bash
        run: |
          mkdir -p results metrics
          python - <<'PY'
          from pathlib import Path
          import os
          import re
          import shlex
          import subprocess
          import time

          sequence = os.environ["SEQUENCE"]
          docker = [
              "docker", "run", "--rm", "--network", "none",
              "--user", f"{os.getuid()}:{os.getgid()}",
              "--cpus", "4", "--memory", "8g", "--memory-swap", "8g",
              "--read-only", "--tmpfs", "/tmp:rw,exec,size=512m",
              "-v", f"{Path.cwd()}/data/{sequence}:/recording:ro",
              "-v", f"{Path.cwd()}/results:/results", "slam-dunk-benchmark",
          ]

          def parse_help(command):
              help_text = subprocess.check_output([*docker, command, "--help"], text=True)
              print(help_text, flush=True)
              usage = help_text.split("\n\n")[0].split(f" {command} ", 1)[-1]
              optional = re.findall(r"\[([^\[\]]+)\]", usage)
              positional = re.sub(r"\[[^\[\]]+\]", " ", usage).split()
              if not positional or any(not re.fullmatch(r"[\w-]+", name) for name in positional):
                  raise ValueError(f"Cannot identify {command} positional arguments")
              return positional, optional

          def role(name):
              name = name.lower().strip("-").replace("-", "_")
              if "config" in name:
                  return "config"
              if any(word in name for word in ("output", "result", "out_dir", "destination")) or name == "out":
                  return "output"
              if any(word in name for word in ("frontend", "packet", "prepared", "cache", "artifact", "workdir")):
                  return "frontend"
              if any(word in name for word in ("record", "data", "sequence", "dataset")):
                  return "recording"
              return None

          def arguments(command, help_result, model):
              positional, optional = help_result
              values = {
                  "output": "/results/frontend" if command == "prepare" else f"/results/{model}",
                  "recording": "/recording",
                  "frontend": "/results/frontend",
                  "config": f"configs/{model}.json",
              }
              keys = [role(name) for name in positional]
              if command == "prepare" and len(keys) == 2:
                  default = ["recording", "output"]
              elif command == "refine" and len(keys) == 2:
                  default = ["frontend", "output"]
                  if keys[0] == "recording":
                      keys[0] = "frontend"
              elif command == "refine" and len(keys) == 3:
                  default = ["recording", "frontend", "output"]
              else:
                  default = [None] * len(keys)
              keys = [key or fallback for key, fallback in zip(keys, default)]
              if any(key is None for key in keys) or len(set(keys)) != len(keys):
                  raise ValueError(f"Cannot map {command} positional arguments: {positional}")
              required = {"recording", "output"} if command == "prepare" else {"frontend", "output", "config"}
              args = [values[key] for key in keys]
              missing = required.difference(keys)
              for spec in optional:
                  flag, *metavar = spec.split()
                  key = role(flag)
                  if key in missing and flag.startswith("--") and metavar:
                      args.extend([flag, values[key]])
                      missing.remove(key)
              if missing:
                  raise ValueError(f"Cannot identify {command} arguments for {sorted(missing)}")
              if command == "prepare" and "config" not in keys and any(
                  spec.startswith("--config ") for spec in optional
              ):
                  args.extend(["--config", values["config"]])
              return args

          def run(command, args, timing):
              invocation = [*docker, command, *args]
              print(shlex.join(invocation), flush=True)
              start = time.monotonic()
              subprocess.run(invocation, check=True)
              Path(f"metrics/{timing}_seconds.txt").write_text(f"{time.monotonic() - start:.3f}\n")

          models = ("baseline", "camera_only", "gyro_only", "full")
          prepare = parse_help("prepare")
          refine = parse_help("refine")
          packet_args = arguments("prepare", prepare, "full")
          model_args = {model: arguments("refine", refine, model) for model in models}
          run("prepare", packet_args, "frontend")
          for model in models:
              run("refine", model_args[model], model)
              trajectory = Path(f"results/{model}/estimate/trajectory.txt")
              if not trajectory.is_file() or not trajectory.stat().st_size:
                  raise FileNotFoundError(trajectory)
          PY

      - name: Score all four configurations with the same evaluator
        shell: bash
        run: |
          mkdir -p labels
          curl -fsSL --retry 5 "$DATA/ground_truth/pseudo_dense/$SEQUENCE.txt" -o "labels/$SEQUENCE.txt"
          curl -fsSL --retry 5 "$DATA/ground_truth/sparse/$SEQUENCE.json" -o "labels/$SEQUENCE.json"
          python -m venv .venv-metrics
          python -m venv .venv-cp
          .venv-metrics/bin/pip install --no-cache-dir -r upstream/evaluation/metrics-requirements.lock
          .venv-cp/bin/pip install --no-cache-dir -r upstream/evaluation/official-evaluator-requirements.lock
          for name in baseline camera_only gyro_only full; do
            estimate="results/$name/estimate/trajectory.txt"
            output="metrics/$name/metrics.json"
            mkdir -p "$(dirname "$output")"
            .venv-metrics/bin/python upstream/evaluation/score_lamaria.py \
              "data/$SEQUENCE" "$estimate" "$output" \
              --cp-python "$PWD/.venv-cp/bin/python" \
              --public-pgt "labels/$SEQUENCE.txt" --public-control-points "labels/$SEQUENCE.json"
          done
          {
            printf '### LaMAria %s, full sequence\n\n' "$SEQUENCE"
            printf '| Method | CP score | CP recall at 1 m (%%) | APE RMSE (m) |\n|---|---:|---:|---:|\n'
            for method in baseline camera_only gyro_only full; do
              jq -r --arg method "$method" '"| \($method) | \(.cp_score) | \(.cp_recall_1m) | \(.ate_rmse_m) |"' "metrics/$method/metrics.json"
            done
            printf '\nShared frontend time on this runner (4 vCPUs): %s s.\n' "$(cat metrics/frontend_seconds.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save numeric benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: slam-dunk-ablation-metrics-sequence_1_19
          path: |
            metrics/*_seconds.txt
            metrics/*/metrics.json
          if-no-files-found: warn
          retention-days: 14
