name: Control-point diagnostics for the LaMAria calibration ablation

on:
  push:
    branches: [benchmark/visloc-cp-diagnostics]

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Fetch the original sequence_3_17 evaluation
        uses: actions/download-artifact@v8
        with:
          name: estimate-sequence_3_17
          run-id: "44584959211"
          github-token: ${{ github.token }}
          path: original

      - name: Install the pinned official evaluation libraries
        shell: bash
        run: |
          git init -q evaluator
          git -C evaluator fetch -q --depth=1 https://github.com/cvg/lamaria.git 238b6cad307a10183277388c9c0a8406cde48197
          git -C evaluator checkout -q --detach FETCH_HEAD
          python -m pip install --quiet --disable-pip-version-check \
            --find-links https://cvg-data.inf.ethz.ch/lamaria/packages/pycolmap/ \
            numpy==2.5.3 scipy==1.18.1 pycolmap==3.13.0.dev0 pyceres==2.6

      - name: Compare saved control-point errors and trajectory errors by time
        shell: bash
        run: |
          mkdir -p diagnostic
          data=https://cvg-data.inf.ethz.ch/lamaria/ground_truth
          curl -fsSL --retry 3 "$data/sparse/sequence_3_17.json" -o control_points.json
          curl -fsSL --retry 3 "$data/pseudo_dense/sequence_3_17.txt" -o reference.txt
          PYTHONPATH="$PWD/evaluator" python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          import numpy as np

          from lamaria.structs.sparse_eval import SparseEvalResult
          from lamaria.utils.metrics import (
              calculate_control_point_recall,
              calculate_control_point_score,
              calculate_error,
          )

          (metrics_path,) = Path("original").rglob("camera_gyro_ablation.json")
          results_dir = metrics_path.parent
          aggregate = json.loads(metrics_path.read_text())
          paths = {
              "baseline": results_dir / "baseline_estimate.txt",
              "camera_only": results_dir / "camera_only_estimate.txt",
              "gyro_only": results_dir / "gyro_only_estimate.txt",
              "full": Path("original/slam/sequence_3_17.txt"),
          }

          def samples(path):
              values = np.loadtxt(path, usecols=(0, 1, 2, 3), ndmin=2)
              times, indices = np.unique(values[:, 0], return_index=True)
              return times, values[indices, 1:]

          start_ns = int(paths["baseline"].read_text().splitlines()[0].split()[0])
          raw = json.loads(Path("control_points.json").read_text())
          time_by_image = {
              name: int(ns)
              for stream in raw["timestamps"].values()
              for ns, name in stream.items()
          }
          observations = {}
          for geo_id, info in raw["control_points"].items():
              times = sorted(set(time_by_image[name] for name in info["image_names"]))
              for tag in info["tag_id"]:
                  observations[int(tag)] = (geo_id, times)

          errors = {}
          scales = {}
          for name in paths:
              result = SparseEvalResult.load_from_npy(results_dir / f"cp_{name}" / "sparse_eval_result.npy")
              expected = aggregate["metrics"][name]
              if (abs(calculate_control_point_score(result) - expected["cp_score"]) > 0.000051
                      or abs(calculate_control_point_recall(result) - expected["cp_recall_1m"]) > 0.000051):
                  raise ValueError(f"The saved control points do not reproduce {name}'s official score")
              errors[name] = {
                  int(tag): float(error) if np.isfinite(error) else None
                  for tag, error in zip(result.cp_summary, calculate_error(result), strict=True)
              }
              scales[name] = float(result.alignment.scale)
          tags = set(errors["baseline"])
          if any(set(case) != tags for case in errors.values()) or tags != set(observations):
              raise ValueError("Control-point identifiers differ between the evaluations and the public labels")

          rows = []
          for tag in sorted(tags, key=lambda tag: (observations[tag][1][0], tag)):
              geo_id, times = observations[tag]
              row = {
                  "tag_id": tag,
                  "survey_id": geo_id,
                  "first_detection_s": round((times[0] - start_ns) / 1e9, 2),
                  "last_detection_s": round((times[-1] - start_ns) / 1e9, 2),
                  "distinct_detection_timestamps": len(times),
                  **{name: errors[name][tag] for name in paths},
              }
              rows.append(row)

          reference_times, reference_points = samples("reference.txt")
          positions = {}
          common = np.ones(len(reference_times), dtype=bool)
          for name, path in paths.items():
              times, points = samples(path)
              right = np.clip(np.searchsorted(times, reference_times), 1, len(times) - 1)
              left = right - 1
              span = times[right] - times[left]
              common &= (reference_times >= times[0]) & (reference_times <= times[-1]) & (span <= 100_000_000)
              weights = (reference_times - times[left]) / span
              positions[name] = points[left] + weights[:, None] * (points[right] - points[left])
          if common.sum() != aggregate["matched_reference_poses"]:
              raise ValueError("The trajectory pairing differs from the original evaluation")
          elapsed = (reference_times[common] - start_ns) / 1e9
          target = reference_points[common]
          squared = {}
          for name, points in positions.items():
              estimate = points[common]
              x, y = estimate - estimate.mean(axis=0), target - target.mean(axis=0)
              u, _, vh = np.linalg.svd(x.T @ y)
              rotation = u @ np.diag([1, 1, np.linalg.det(u @ vh)]) @ vh
              squared[name] = np.sum((x @ rotation - y) ** 2, axis=1)
              expected = aggregate["metrics"][name]["se3_position_rmse_m"]
              if not np.isclose(np.sqrt(np.mean(squared[name])), expected, atol=1e-9):
                  raise ValueError(f"Global position RMSE does not reproduce for {name}")
          periods = []
          minute_pairs = np.floor(elapsed / 120).astype(int)
          for period in np.unique(minute_pairs):
              mask = minute_pairs == period
              periods.append({
                  "start_s": int(period) * 120,
                  "end_s": (int(period) + 1) * 120,
                  "reference_poses": int(mask.sum()),
                  **{name: float(np.sqrt(np.mean(values[mask]))) for name, values in squared.items()},
              })

          for filename, data in (("control_points.csv", rows), ("position_rmse_by_interval.csv", periods)):
              with (Path("diagnostic") / filename).open("w", newline="") as file:
                  writer = csv.DictWriter(file, fieldnames=list(data[0]))
                  writer.writeheader()
                  writer.writerows(data)
          Path("diagnostic/alignment_scales.json").write_text(json.dumps(scales, indent=2) + "\n")

          def metres(value):
              return "missing" if value is None else f"{value:.3f}"

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              print("### sequence_3_17 control-point horizontal errors (m)", file=summary)
              print("| Tag | Detected after (s) | Baseline | Camera only | Gyro only | Both |", file=summary)
              print("|---:|---:|---:|---:|---:|---:|", file=summary)
              for row in rows:
                  print("|", row["tag_id"], "|", row["first_detection_s"], "–", row["last_detection_s"],
                        "|", " | ".join(metres(row[name]) for name in paths), "|", file=summary)
          for row in rows:
              print("CP_DIAGNOSTIC", json.dumps(row, allow_nan=False), flush=True)
          for period in periods:
              print("PERIOD_DIAGNOSTIC", json.dumps(period, allow_nan=False), flush=True)
          print("ALIGNMENT_SCALES", json.dumps(scales, allow_nan=False), flush=True)
          PY

      - name: Save the control-point and trajectory diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: sequence_3_17-control-point-diagnostics
          path: diagnostic/
          if-no-files-found: error
          retention-days: 14
