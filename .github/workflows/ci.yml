name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check workspace
        run: scripts/check_msrv.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: Documentation links
        run: scripts/check_docs_links.sh

      - name: Examples
        run: scripts/run_examples.sh

      - name: GNSS demo outputs
        run: scripts/check_gnss_demo_outputs.sh

      - name: Timestamped GNSS image demo outputs
        run: scripts/check_timestamped_gnss_image_demo_outputs.sh

      - name: KITTI image sequence demo outputs
        run: scripts/check_kitti_image_sequence_demo_outputs.sh

      - name: Upload GNSS demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: gnss-demo-outputs
          path: target/visloc_gnss_tracking_demo_check
          if-no-files-found: error
          retention-days: 14

      - name: Upload timestamped GNSS image demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: timestamped-gnss-image-demo-outputs
          path: target/visloc_timestamped_image_sequence_demo
          if-no-files-found: error
          retention-days: 14

      - name: Upload KITTI image sequence demo outputs
        uses: actions/upload-artifact@v4
        with:
          name: kitti-image-sequence-demo-outputs
          path: target/visloc_kitti_image_sequence_demo
          if-no-files-found: error
          retention-days: 14

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Package
        run: scripts/package_check.sh
