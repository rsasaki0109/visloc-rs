name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  msrv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust 1.82.0
        uses: dtolnay/rust-toolchain@1.82.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check workspace
        run: scripts/check_msrv.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

      - name: API stability allowlist
        run: cargo test --test api_stability -- --nocapture

      - name: Python tests
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pillow numpy pytest opencv-python-headless
          python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Benchmark registry
        run: |
          python3 scripts/benchmark_registry.py validate benchmarks/registry/readme_claims_v1.json benchmarks/registry/claim_matrix_v1.json benchmarks/registry/runs
          python3 scripts/benchmark_registry.py check-generated --readme docs/readme_details.md

      - name: Documentation links
        run: scripts/check_docs_links.sh

      - name: Release metadata
        run: scripts/check_release_metadata.sh

      - name: Examples
        run: scripts/run_examples.sh

      - name: Trajectory evaluation
        run: scripts/check_trajectory_evaluation.sh

      - name: GNSS demo outputs
        run: scripts/check_gnss_demo_outputs.sh

      - name: Timestamped GNSS image demo outputs
        run: scripts/check_timestamped_gnss_image_demo_outputs.sh

      - name: KITTI image sequence demo outputs
        run: scripts/check_kitti_image_sequence_demo_outputs.sh

      - name: Upload GNSS demo outputs
        uses: actions/upload-artifact@v7
        with:
          name: gnss-demo-outputs
          path: target/visloc_gnss_tracking_demo_check
          if-no-files-found: error
          retention-days: 14

      - name: Upload timestamped GNSS image demo outputs
        uses: actions/upload-artifact@v7
        with:
          name: timestamped-gnss-image-demo-outputs
          path: target/visloc_timestamped_image_sequence_demo
          if-no-files-found: error
          retention-days: 14

      - name: Upload KITTI image sequence demo outputs
        uses: actions/upload-artifact@v7
        with:
          name: kitti-image-sequence-demo-outputs
          path: target/visloc_kitti_image_sequence_demo
          if-no-files-found: error
          retention-days: 14

      - name: Docs
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: Package
        run: scripts/package_check.sh

  feature-matrix:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        feature:
          - name: no-default
            command: cargo check --workspace --all-targets --no-default-features
          - name: default
            command: cargo check --workspace --all-targets
          - name: image-io
            command: cargo check --workspace --all-targets --features image-io
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: feature-matrix-${{ matrix.os }}-${{ matrix.feature.name }}

      - name: Check ${{ matrix.feature.name }}
        run: ${{ matrix.feature.command }}
