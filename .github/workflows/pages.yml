name: pages

# The GitHub Pages site: docs/ as is, plus the browser VIO demo
# (bindings/wasm, both builds from its build.sh) under slam/, the splat
# viewer (bindings/splat-web) under splat/ and the browser SfM
# (bindings/sfm-web) under sfm/. Needs Settings > Pages > Source set to
# "GitHub Actions".

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchains
        run: |
          rustup target add wasm32-unknown-unknown
          rustup toolchain install nightly-2026-04-10 --profile minimal \
            --component rust-src --target wasm32-unknown-unknown

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            bindings/wasm -> target
            bindings/wasm -> target/mt
            bindings/splat-web -> target
            bindings/sfm-web -> target

      - name: Install wasm-bindgen-cli
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/"/, "", $3); print $3 }' bindings/wasm/Cargo.lock)
          cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the browser VIO
        run: bindings/wasm/build.sh

      # The same wasm-bindgen as the VIO (their Cargo.locks were seeded from bindings/wasm's).
      - name: Build the splat viewer
        run: bindings/splat-web/build.sh

      - name: Build the browser SfM
        run: bindings/sfm-web/build.sh

      - name: Assemble the site
        run: |
          cp -r docs _site
          bindings/wasm/deploy_pages.sh --dir _site/slam
          cp -r bindings/splat-web/web _site/splat
          cp -r bindings/sfm-web/web _site/sfm
          test -f _site/slam/index.html
          test -f _site/slam/pkg/visloc_wasm_bg.wasm
          test -f _site/slam/pkg-mt/visloc_wasm_bg.wasm
          test -f _site/splat/pkg/visloc_splat_web_bg.wasm
          test -f _site/sfm/pkg/visloc_sfm_web_bg.wasm
          test -f _site/sfm/vendor/three.js

      - name: Upload
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
