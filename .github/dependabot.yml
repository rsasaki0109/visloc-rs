version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - rust
    groups:
      rust-dependencies:
        patterns:
          - "*"
    ignore:
      # nalgebra 0.34+ requires Rust 1.87; the project MSRV is 1.88 (see the
      # `msrv` CI job and rust-toolchain.toml). Bump deliberately with an MSRV
      # change, not via Dependabot.
      - dependency-name: "nalgebra"
        versions: [">=0.34"]
      # nalgebra-sparse 0.11+ tracks nalgebra 0.34 (same 1.87 MSRV).
      - dependency-name: "nalgebra-sparse"
        versions: [">=0.11"]
      # rand 0.9 changes RNG output, which would shift RANSAC results and break
      # the documented binary-determinism gates and README headline numbers.
      # Upgrade deliberately with a re-baseline, not via Dependabot.
      - dependency-name: "rand"
        versions: [">=0.9"]
      # image is exact-pinned (=0.25.5) on purpose: newer 0.25.x patches pull
      # transitive deps (e.g. moxcms) that require edition2024 / Rust >= 1.85,
      # broke the old 1.83 MSRV image-io build; re-evaluate now that the MSRV is 1.88.
      - dependency-name: "image"
        versions: [">0.25.5"]
      # wide 1.x (and its safe_arch 1.x) requires Rust 1.89, above the 1.88
      # MSRV, and renames `cmp_lt` to `simd_lt`. Bump with an MSRV change.
      - dependency-name: "wide"
        versions: [">=1"]
      # ort 2.0 release candidates break the API between candidates
      # (rc.14: `Session::builder` takes an `&Environment`). Bump
      # deliberately and re-check the ONNX models, not via Dependabot.
      - dependency-name: "ort"
        versions: [">2.0.0-rc.13"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    ignore:
      # The `msrv` CI job pins this action to the declared MSRV (1.88.0) on
      # purpose; it must not track the latest toolchain release.
      - dependency-name: "dtolnay/rust-toolchain"
