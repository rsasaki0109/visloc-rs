[package]
name = "visloc-basalt"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Faithful Basalt VI-SLAM contracts and calibration foundations for visloc-rs."
readme = "PROVENANCE.md"
documentation = "https://docs.rs/visloc-basalt"
homepage.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

# This crate intentionally retains a large set of upstream-parity reference
# implementations (the `upstream_f32_*`/`eigen_*`/`sophus_*`/`lm_token_*`
# families, and similar oracle/diagnostic helpers) that are not called from
# the production estimator path but exist to be re-enabled or exercised
# manually while auditing bit-for-bit parity against the pinned C++
# reference. Deleting them would be a real behavior change to what this
# faithful port carries, so `dead_code` stays allowed package-wide rather
# than pruning items one at a time.
#
# The clippy lints below are style-only and suppressed package-wide rather
# than hand-editing the numeric/algorithmic code they flag (see the CI
# `clippy` gate): this crate is a faithful, bit-parity-audited port, so
# behavior-preserving-by-inspection is not enough here — any rewrite (even a
# clippy-suggested "equivalent" one, e.g. `map_or` -> `is_none_or`, or
# truncating an `excessive_precision` float literal) is exactly the kind of
# change that could perturb the pinned parity numerics this crate exists to
# reproduce. None of these lints affect correctness; they are all
# style/idiom suggestions. A `[lints]` table (rather than inner `#![allow]`
# attributes in lib.rs) is used so it also covers this package's
# `examples/`/`tests/` binaries, which are separate crate roots.
[lints.rust]
dead_code = "allow"

[lints.clippy]
needless_range_loop = "allow"
excessive_precision = "allow"
too_many_arguments = "allow"
needless_borrows_for_generic_args = "allow"
clone_on_copy = "allow"
field_reassign_with_default = "allow"
type_complexity = "allow"
result_large_err = "allow"
needless_borrow = "allow"
manual_contains = "allow"
if_same_then_else = "allow"
cloned_ref_to_slice_refs = "allow"
unnecessary_lazy_evaluations = "allow"
let_and_return = "allow"
derivable_impls = "allow"
redundant_closure = "allow"
question_mark = "allow"
needless_lifetimes = "allow"
unused_enumerate_index = "allow"
unnecessary_map_or = "allow"
neg_cmp_op_on_partial_ord = "allow"
needless_question_mark = "allow"
needless_option_as_deref = "allow"
filter_map_bool_then = "allow"
assertions_on_constants = "allow"
items_after_test_module = "allow"

[features]
default = []
# Keep timing out of canonical release builds unless explicitly requested.
basalt-timing-breakdown = []
# Capacity-only reuse of the clean LM landmark QR scratch buffers.  Disabled
# by default so canonical builds retain the historical allocation path.
basalt-lm-workspace-reuse = []
[dependencies]
base64 = "0.23"
image = { version = "=0.25.5", default-features = false, features = ["png"] }
nalgebra = { workspace = true }
rayon = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = { workspace = true }
visloc-core = { path = "../../crates/core", version = "0.2.0" }
